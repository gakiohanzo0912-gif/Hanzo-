<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14181f">
  <title>SUGIURA QUEST 〜姪っ子と豆柴の冒険〜</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="wrap">
    <h1 id="head">SUGIURA QUEST</h1>
    <canvas id="game" width="768" height="512" aria-label="ゲーム画面"></canvas>
    <div id="controls">
      <div id="pad" aria-label="操作ボタン">
        <button type="button" data-dir="up" aria-label="上">▲</button>
        <button type="button" data-dir="left" aria-label="左">◀</button>
        <button type="button" data-dir="down" aria-label="下">▼</button>
        <button type="button" data-dir="right" aria-label="右">▶</button>
      </div>
      <button type="button" id="abtn" aria-label="はなす・しらべる">A</button>
    </div>
    <p id="foot">矢印キー / WASD で移動 ・ Z / Enter / スペースで はなす・しらべる ・ G キーでマス目の表示</p>
  </div>

  <script src="assets/sprites/sprites.js?v=5"></script>
  <script src="src/scenes.js?v=5"></script>
  <script src="src/world.js?v=5"></script>
  <script src="src/story.js?v=5"></script>
  <script src="src/art.js?v=5"></script>
  <script src="src/main.js?v=5"></script>
</body>
</html>
